services:
  - type: web
    name: dashboard
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn dashboard:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: src
